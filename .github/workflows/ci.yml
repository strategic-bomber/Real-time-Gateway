# act -j python-tests

# or maybe 
# act -j python-tests -P ubuntu-latest=catthehacker/ubuntu:act-latest

name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./python_api
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt
      
      - name: Run tests with coverage
        run: |
          pip install pytest-cov
          pytest tests/ -v --cov=. --cov-report=xml --cov-report=term
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./python_api/coverage.xml
          flags: python

  go-tests:
    name: Go Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./go_gateway
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      
      - name: Download dependencies
        run: go mod download
      
      - name: Run tests with coverage
        run: go test ./... -v -race -coverprofile=coverage.out
      
      - name: Upload coverage
        uses: actions/upload-artifact@v3
        with:
          name: go-coverage
          path: go_gateway/coverage.out

  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [python-tests, go-tests]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Go
        working-directory: ./go_gateway
        run: go build -v ./...
      
      - name: Check Python imports
        working-directory: ./python_api
        run: |
          pip install -r requirements.txt
          python -c "from main import app; print('OK')"


