version: '3.8'

services:
  python-api:
    build:
      context: ./python_api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - GATEWAY_URL=http://go-gateway:8080
      - DATABASE_URL=sqlite:///./deal_data.db
    volumes:
      - ./python_api:/app
      - python-data:/app/data
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - go-gateway

  go-gateway:
    build:
      context: ./go_gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PYTHON_API_URL=http://python-api:8000
      - SERVICE_SECRET=dev-secret-key
    volumes:
      - ./go_gateway:/app
    command: go run main.go

  frontend:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - python-api
      - go-gateway

volumes:
  python-data: